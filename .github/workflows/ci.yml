name: CI
on:
  pull_request:
    branches:
      - development
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run test:links

      - name: Smoke tests
        run: npm test

      # Screenshots prod (https://danielng.info) and compares this PR's build against it.
      # Expected to fail on PRs that intentionally change the design; check the report.
      - name: Visual comparison against prod
        run: npm run test:visual

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
