name: Deploy to Development
on:
  push:
    branches:
      - development

env:
  DEV_BUCKET: dev.danielng.info
  DEV_DISTRIBUTION_ID: E24HL512F9Q50G
  DEV_URL: https://dev.danielng.info

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Build
      run: npm run build

    - name: Check internal links
      run: npm run test:links

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # Only the build output is uploaded; --delete removes anything not in dist/.
    - name: Sync build to Development S3
      run: aws s3 sync dist/ s3://$DEV_BUCKET --delete

    - name: Invalidate CloudFront cache
      run: |
        id=$(aws cloudfront create-invalidation \
          --distribution-id $DEV_DISTRIBUTION_ID \
          --paths "/*" \
          --query Invalidation.Id --output text)
        aws cloudfront wait invalidation-completed --distribution-id $DEV_DISTRIBUTION_ID --id "$id"

    - name: Smoke tests against dev
      run: npm test
      env:
        BASE_URL: ${{ env.DEV_URL }}

    # QA signal, not a gate: shows how dev differs from prod.
    - name: Visual comparison of dev against prod
      continue-on-error: true
      run: npm run test:visual
      env:
        BASE_URL: ${{ env.DEV_URL }}

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-dev
        path: |
          playwright-report/
          test-results/
        retention-days: 14
