name: Deploy to Prod
# Runs on every push to main (i.e. a merged PR). A push always uses the workflow
# file as it exists on main; a pull_request trigger would instead run the copy on
# the PR's branch, which let a stale branch deploy without a build or approval.
on:
  push:
    branches:
      - main
  workflow_dispatch:      # manual redeploy of main from the Actions tab

# Never run two prod deploys at once; a newer one waits for the current one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PROD_BUCKET: danielng.info
  PROD_URL: https://danielng.info

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in GitHub settings to gate prod deploys.
    environment:
      name: production
      url: https://danielng.info

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run test:links

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Only the build output is uploaded; --delete removes anything not in dist/.
      - name: Sync build to Production S3
        run: aws s3 sync dist/ s3://$PROD_BUCKET --delete

      - name: Invalidate CloudFront cache
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_CLOUD_FRONT_DISTRIBUTION }} \
            --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.PROD_CLOUD_FRONT_DISTRIBUTION }} --id "$id"

      - name: Smoke tests against prod
        run: npm test
        env:
          BASE_URL: ${{ env.PROD_URL }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: |
            playwright-report/
            test-results/
          retention-days: 14
